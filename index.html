<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102c53">
  <title>eQuiz Nepal | Learn • Practice • Compete</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #f3f7fc; font-family: system-ui, sans-serif; }
    iframe { width: 100%; height: 100dvh; border: 0; display: block; }
    .notice { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #123358; }
    .notice > div { max-width: 460px; }
    .notice img { width: 92px; height: 92px; object-fit: contain; }
    .notice p { line-height: 1.7; }
    .notice small { color: #65758b; }
  </style>
</head>
<body>
  <div id="setup" class="notice">
    <div>
      <img src="./logo.png" alt="eQuiz Nepal Logo" onerror="this.style.display='none'">
      <h1>eQuiz Nepal</h1>
      <p>Google Apps Script को नयाँ Web App URL राखेपछि यहाँ पूर्ण Quiz System खुल्नेछ ।</p>
      <small>Designed &amp; Developed by Nirajan Aryal (9851113811)</small>
    </div>
  </div>
  <script>
    'use strict';
    // Replace with the deployed Apps Script Web App /exec URL.
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzaVoBQH-uL60f-pCt2668s2PC3CsNnM2rXkrsRD4CEzKX_sde1p_gZFPQMR01ddUb9/exec';
    if (/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(WEB_APP_URL)) {
      const frame = document.createElement('iframe');
      frame.src = WEB_APP_URL;
      frame.title = 'eQuiz Nepal Application';
      frame.setAttribute('allow', 'clipboard-write');
      document.body.appendChild(frame);
      document.getElementById('setup').remove();
    }
  </script>
</body>
</html>
